<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTChess Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #222; color: #fff; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .pass { background: #2d5a2d; }
        .fail { background: #5a2d2d; }
        .info { background: #2d4a5a; }
    </style>
</head>
<body>
    <h1>RTChess Debug Test</h1>
    <div id="test-results"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script>
        const results = document.getElementById('test-results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }
        
        // Test 1: Check if p5.js is loaded
        if (typeof p5 !== 'undefined') {
            addResult('✓ p5.js library loaded successfully', 'pass');
        } else {
            addResult('✗ p5.js library failed to load', 'fail');
        }
        
        // Test 2: Check if we can create basic p5 functions
        try {
            let testCanvas = null;
            function setup() {
                testCanvas = createCanvas(100, 100);
                testCanvas.parent(document.body);
                addResult('✓ p5.js canvas creation works', 'pass');
                testCanvas.remove(); // Clean up
            }
            
            function draw() {
                // Test draw function
            }
            
            addResult('✓ p5.js setup/draw functions defined', 'pass');
        } catch (e) {
            addResult('✗ p5.js setup/draw error: ' + e.message, 'fail');
        }
        
        // Test 3: Load and test game files
        const gameFiles = [
            'js/piece.js',
            'js/messenger.js', 
            'js/cards.js',
            'js/player.js',
            'js/main.js'
        ];
        
        let loadedFiles = 0;
        gameFiles.forEach(file => {
            const script = document.createElement('script');
            script.src = file;
            script.onload = () => {
                loadedFiles++;
                addResult(`✓ Loaded ${file}`, 'pass');
                
                if (loadedFiles === gameFiles.length) {
                    // All files loaded, run final tests
                    setTimeout(runGameTests, 100);
                }
            };
            script.onerror = () => {
                addResult(`✗ Failed to load ${file}`, 'fail');
            };
            document.head.appendChild(script);
        });
        
        function runGameTests() {
            addResult('--- Running Game Logic Tests ---', 'info');
            
            // Test 4: Check if classes are defined
            try {
                if (typeof Piece !== 'undefined') {
                    addResult('✓ Piece class defined', 'pass');
                    
                    // Test piece creation
                    const testPiece = new Piece('test', 'white', 'Pawn', {x: 0, y: 0});
                    if (testPiece.baseStrength === 1) {
                        addResult('✓ Piece creation and base strength calculation works', 'pass');
                    } else {
                        addResult('✗ Piece base strength calculation failed', 'fail');
                    }
                } else {
                    addResult('✗ Piece class not defined', 'fail');
                }
            } catch (e) {
                addResult('✗ Piece class error: ' + e.message, 'fail');
            }
            
            try {
                if (typeof Player !== 'undefined') {
                    addResult('✓ Player class defined', 'pass');
                } else {
                    addResult('✗ Player class not defined', 'fail');
                }
            } catch (e) {
                addResult('✗ Player class error: ' + e.message, 'fail');
            }
            
            try {
                if (typeof Messenger !== 'undefined') {
                    addResult('✓ Messenger class defined', 'pass');
                } else {
                    addResult('✗ Messenger class not defined', 'fail');
                }
            } catch (e) {
                addResult('✗ Messenger class error: ' + e.message, 'fail');
            }
            
            try {
                if (typeof CARD_DEFINITIONS !== 'undefined') {
                    addResult('✓ CARD_DEFINITIONS object defined', 'pass');
                    addResult(`✓ Found ${Object.keys(CARD_DEFINITIONS).length} card types`, 'pass');
                } else {
                    addResult('✗ CARD_DEFINITIONS not defined', 'fail');
                }
            } catch (e) {
                addResult('✗ CARD_DEFINITIONS error: ' + e.message, 'fail');
            }
            
            // Test 5: Check if main game functions are defined
            const mainFunctions = ['populateBoard', 'drawCheckerboard', 'resolveCombat', 'findNearbyEnemies'];
            mainFunctions.forEach(funcName => {
                if (typeof window[funcName] === 'function') {
                    addResult(`✓ ${funcName} function defined`, 'pass');
                } else {
                    addResult(`✗ ${funcName} function not defined`, 'fail');
                }
            });
            
            addResult('--- Test Complete ---', 'info');
            addResult('If all tests pass, the game should work correctly!', 'info');
        }
    </script>
</body>
</html>
